<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      pre {
        font-family: monospace;
        font-size: 12px;
        line-height: 1.2;
        white-space: pre;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <pre id="art"></pre>

    <script>
      const encoded = "4qCA4qCA..."; // ← ваша строка без изменений
      document.getElementById("art").textContent = new TextDecoder().decode(Uint8Array.from(atob(encoded), c => c.charCodeAt(0)));
    </script>

    <script src="https://my.zadarma.com/webphoneWebRTCWidget/v9/js/loader-phone-lib.js?sub_v=1"></script>
    <script src="https://my.zadarma.com/webphoneWebRTCWidget/v9/js/loader-phone-fn.js?sub_v=1"></script>

    <script>
      const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyzhYicg86_1HmaTfoY8hFOxnPXlgy2fWVybTGjW0AFRKMUgC5P3pW9BgLxN3OcmV8Etg/exec";

      async function initWidget() {
        try {
          const response = await fetch(APPS_SCRIPT_URL);
          const data = await response.json();
          const apiKey = data.key;

          if (!apiKey || apiKey.startsWith("Error")) {
            console.error("Ошибка получения ключа:", apiKey);
            return;
          }

          zadarmaWidgetFn(
            apiKey,
            '10197-112',
            'square',
            'ru',
            true,
            {right: '10px', bottom: '5px'}
          );

        } catch (err) {
          console.error("Не удалось получить ключ:", err);
        }
      }

      window.addEventListener("load", initWidget);
    </script>

  </body>
</html>
